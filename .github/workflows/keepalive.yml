# Keeps the free Supabase project awake: a tiny read every 2 days.
# (Free projects pause after about a week without activity.)
name: keep-supabase-awake
on:
  schedule:
    - cron: "17 6 */2 * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the database
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" "https://vfewmznnmmppuaaidbnw.supabase.co/rest/v1/tutorials?select=id&limit=1" -H "apikey: sb_publishable_IpUvyrx6CYJFBGQD7nfFwA_dFdPCnJx")
          echo "Supabase answered: $code"
          test "$code" = "200"
